[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-in-revit"
version = "0.0.1"
description = "Conversational LLM agent integrated with Autodesk Revit via PyRevit"
requires-python = ">=3.8"
dependencies = [
    "anthropic>=0.40.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
